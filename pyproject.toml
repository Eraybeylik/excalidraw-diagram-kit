[project]
name = "exdraw"
version = "0.1.0"
description = "Generate Excalidraw diagrams (incl. Obsidian .excalidraw.md) from Python, and render them to PNG for verification."
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exdraw-render = "exdraw.render:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["exdraw"]

[tool.setuptools.package-data]
exdraw = ["capture.mjs"]

[tool.pytest.ini_options]
pythonpath = ["."]
